name: Publish production images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: Backend/Dockerfile.production
          push: true
          tags: |
            ghcr.io/jhoaneymarortunoquinteros-hue/gymporky-backend:latest
            ghcr.io/jhoaneymarortunoquinteros-hue/gymporky-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Fronted
          file: Fronted/Dockerfile.production
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ghcr.io/jhoaneymarortunoquinteros-hue/gymporky-frontend:latest
            ghcr.io/jhoaneymarortunoquinteros-hue/gymporky-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Make backend package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH /user/packages/container/gymporky-backend/visibility -f visibility=public

      - name: Make frontend package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH /user/packages/container/gymporky-frontend/visibility -f visibility=public
