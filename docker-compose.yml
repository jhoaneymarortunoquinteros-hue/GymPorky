services:
  postgres:
    image: postgres:16-alpine
    container_name: porkygym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-porky_gym_db}
      POSTGRES_USER: ${DB_USER:-usuario_postgresql}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234postgre}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: porkygym-backend
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-porky_gym_db}
      DB_USER: ${DB_USER:-usuario_postgresql}
      DB_PASSWORD: ${DB_PASSWORD:-1234postgre}
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-key}
      FRONTEND_URL: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend,postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./Fronted
      dockerfile: Dockerfile
    container_name: porkygym-frontend
    env_file:
      - ./Fronted/.env
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./Fronted:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  postgres_data:
